<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Task Manager</h1>
  <p class="sub">Plan your day. Tasks are saved in this browser.</p>

  <section class="panel">
    <form class="add" id="form">
      <input class="title" id="title" type="text" placeholder="What needs doing?" maxlength="120" required aria-label="Task title">
      <select id="priority" aria-label="Priority">
        <option value="low">Low priority</option>
        <option value="medium" selected>Medium priority</option>
        <option value="high">High priority</option>
      </select>
      <input id="due" type="date" aria-label="Due date">
      <button class="primary" id="submit" type="submit">Add task</button>
      <button type="button" id="cancel" hidden>Cancel edit</button>
    </form>
  </section>

  <section class="panel">
    <div class="tools">
      <input id="search" type="search" placeholder="Search tasks" aria-label="Search tasks">
      <select id="fPriority" aria-label="Filter by priority">
        <option value="all">All priorities</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option>
      </select>
      <select id="sort" aria-label="Sort tasks">
        <option value="newest">Newest first</option><option value="oldest">Oldest first</option>
        <option value="priority">Priority</option><option value="due">Due date</option><option value="az">A to Z</option>
      </select>
    </div>
    <div class="tabs" id="tabs">
      <button data-s="all" aria-pressed="true">All</button>
      <button data-s="active" aria-pressed="false">Active</button>
      <button data-s="completed" aria-pressed="false">Completed</button>
    </div>
  </section>

  <div class="stats"><span id="count"></span><button id="clear">Clear completed</button></div>
  <ul id="list" aria-live="polite"></ul>
</main>

<script src="script.js"></script>
</body>
</html>
